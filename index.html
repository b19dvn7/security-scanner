<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    .bg {
      position: fixed; inset: 0;
      background: url("frustanswers-bg.png") center/cover no-repeat;
      z-index: 0;
    }
    canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h, cx, cy;
    const particles = [];
    const COUNT = 200;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cx = w / 2;
      cy = h / 2;
    }

    function make() {
      const fromLeft = Math.random() > 0.5;
      const startX = fromLeft ? -20 : w + 20;
      const startY = Math.random() * h;
      const targetX = cx + (Math.random() - 0.5) * 120;
      const targetY = cy + (Math.random() - 0.5) * 80;
      const speed = 0.003 + Math.random() * 0.006;
      return {
        startX, startY, targetX, targetY,
        t: 0, speed,
        size: 0.8 + Math.random() * 2,
        alpha: 0.2 + Math.random() * 0.6,
        trail: 20 + Math.random() * 50,
        hue: 200 + Math.random() * 40
      };
    }

    function init() {
      particles.length = 0;
      for (let i = 0; i < COUNT; i++) {
        const p = make();
        p.t = Math.random();
        particles.push(p);
      }
    }

    function draw(p) {
      p.t += p.speed;
      if (p.t > 1) { Object.assign(p, make()); p.t = 0; }

      const ease = p.t * p.t * (3 - 2 * p.t);
      const x = p.startX + (p.targetX - p.startX) * ease;
      const y = p.startY + (p.targetY - p.startY) * ease;

      const trailT = Math.max(0, p.t - 0.06);
      const te = trailT * trailT * (3 - 2 * trailT);
      const tx = p.startX + (p.targetX - p.startX) * te;
      const ty = p.startY + (p.targetY - p.startY) * te;

      const distFromEdge = Math.min(Math.abs(x - p.startX), Math.abs(w - x));
      const maxDist = w / 2;
      const progress = Math.min(distFromEdge / maxDist, 1);

      const alpha = p.alpha * (1 - progress * 0.5);
      const size = p.size * (1 - progress * 0.4);

      const g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, "rgba(50,120,255,0)");
      g.addColorStop(1, "hsla(" + p.hue + ",80%,75%," + alpha + ")");

      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y);
      ctx.strokeStyle = g; ctx.lineWidth = size; ctx.stroke();

      ctx.beginPath(); ctx.arc(x, y, size * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = "hsla(" + p.hue + ",90%,85%," + (alpha * 0.8) + ")";
      ctx.fill();
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(2,6,13,0.12)"; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      for (const p of particles) draw(p);
      ctx.globalCompositeOperation = "source-over";
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => { resize(); init(); });
    resize(); init(); animate();
  </script>
</body>
</html>
