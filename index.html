<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: url("frustanswers-bg.png") center/cover no-repeat;
      z-index: 0;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h, cx, cy;
    const particles = [];
    const COUNT = 180;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cx = w / 2;
      cy = h * 0.46;
    }
    function make() {
      const a = Math.random() * Math.PI * 2;
      return { a, r: Math.random() * Math.max(w, h), s: 1.2 + Math.random() * 3.2, l: 18 + Math.random() * 70, sz: 0.6 + Math.random() * 1.8, al: 0.12 + Math.random() * 0.42, c: (Math.random() - 0.5) * 0.012 };
    }
    function init() { particles.length = 0; for (let i = 0; i < COUNT; i++) particles.push(make()); }
    function draw(p) {
      p.a += p.c; p.r += p.s;
      const max = Math.sqrt(w * w + h * h) * 0.62;
      if (p.r > max) { Object.assign(p, make()); p.r = 0; return; }
      const x = cx + Math.cos(p.a) * p.r;
      const y = cy + Math.sin(p.a) * p.r * 0.62;
      const t = Math.max(0, p.r - p.l);
      const tx = cx + Math.cos(p.a) * t;
      const ty = cy + Math.sin(p.a) * t * 0.62;
      const d = p.r / max;
      const al = p.al * d;
      const lw = p.sz * (0.5 + d * 1.4);
      const g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, "rgba(50,120,255,0)");
      g.addColorStop(0.45, "rgba(70,155,255," + (al * 0.35) + ")");
      g.addColorStop(1, "rgba(185,225,255," + al + ")");
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y);
      ctx.strokeStyle = g; ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, lw * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(190,230,255," + (al * 0.9) + ")"; ctx.fill();
    }
    function animate() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(2,6,13,0.16)"; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      for (const p of particles) draw(p);
      ctx.globalCompositeOperation = "source-over";
      requestAnimationFrame(animate);
    }
    window.addEventListener("resize", () => { resize(); init(); });
    resize(); init(); animate();
  </script>
</body>
</html>
