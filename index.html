<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; overflow: hidden; }
    .bg {
      position: fixed; inset: 0;
      background: url("frustanswers-bg.png") center/cover no-repeat;
      z-index: 0;
    }
    canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    .logo-glow {
      position: fixed;
      top: 23%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40vw; height: 8vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(100,180,255,0.06) 0%, transparent 70%);
      animation: logoPulse 7s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 55%, 100% { opacity: 0.3; }
      65% { opacity: 1; }
      78% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="logo-glow"></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function bz(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return {
        x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
      };
    }

    const paths = [
      { s:[0.02,0.78], c1:[0.18,0.73], c2:[0.35,0.66], e:[0.49,0.55] },
      { s:[0.05,0.84], c1:[0.22,0.78], c2:[0.38,0.69], e:[0.50,0.58] },
      { s:[0.10,0.70], c1:[0.25,0.66], c2:[0.40,0.60], e:[0.50,0.50] },
      { s:[0.16,0.63], c1:[0.30,0.60], c2:[0.42,0.54], e:[0.50,0.45] },
      { s:[0.98,0.78], c1:[0.82,0.73], c2:[0.65,0.66], e:[0.51,0.55] },
      { s:[0.95,0.84], c1:[0.78,0.78], c2:[0.62,0.69], e:[0.50,0.58] },
      { s:[0.90,0.70], c1:[0.75,0.66], c2:[0.60,0.60], e:[0.50,0.50] },
      { s:[0.84,0.63], c1:[0.70,0.60], c2:[0.58,0.54], e:[0.50,0.45] },
      { s:[0.47,0.78], c1:[0.48,0.68], c2:[0.49,0.55], e:[0.50,0.35] },
      { s:[0.53,0.78], c1:[0.52,0.68], c2:[0.51,0.55], e:[0.50,0.35] },
      { s:[0.50,0.70], c1:[0.50,0.62], c2:[0.50,0.48], e:[0.50,0.28] }
    ];

    const signals = [];
    const STREAK_LEN = 0.018;

    function makeSignal(pathIdx) {
      const path = paths[pathIdx];
      const earlyFade = 0.35 + Math.random() * 0.25;
      const goesFar = Math.random() < 0.25;
      const maxT = goesFar ? (0.75 + Math.random() * 0.25) : earlyFade;
      return {
        pathIdx,
        t: Math.random() * maxT,
        speed: 0.0015 + Math.random() * 0.0025,
        maxT,
        alpha: 0.25 + Math.random() * 0.3,
        width: 0.6 + Math.random() * 0.5,
        hue: 200 + Math.random() * 30
      };
    }

    function init() {
      signals.length = 0;
      for (let i = 0; i < paths.length; i++) {
        const count = i < 8 ? 1 : (Math.random() < 0.5 ? 1 : 0);
        for (let j = 0; j < count; j++) {
          signals.push(makeSignal(i));
        }
      }
    }

    function pt(path, t) {
      return bz(
        { x: path.s[0]*w, y: path.s[1]*h },
        { x: path.c1[0]*w, y: path.c1[1]*h },
        { x: path.c2[0]*w, y: path.c2[1]*h },
        { x: path.e[0]*w, y: path.e[1]*h },
        t
      );
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";

      for (const s of signals) {
        s.t += s.speed;
        if (s.t > s.maxT) {
          s.t = 0;
          s.maxT = (Math.random() < 0.25) ? (0.75 + Math.random()*0.25) : (0.35 + Math.random()*0.25);
        }

        const path = paths[s.pathIdx];
        const progress = s.t / s.maxT;
        const fade = 1 - progress * progress;
        const a = s.alpha * fade;

        if (a < 0.01) continue;

        const head = pt(path, s.t);
        const tail = pt(path, Math.max(0, s.t - STREAK_LEN));

        ctx.beginPath();
        ctx.moveTo(tail.x, tail.y);
        ctx.lineTo(head.x, head.y);
        ctx.strokeStyle = "hsla(" + s.hue + ",70%,72%," + a + ")";
        ctx.lineWidth = s.width * fade;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(head.x, head.y, s.width * 0.5 * fade, 0, Math.PI * 2);
        ctx.fillStyle = "hsla(" + s.hue + ",80%,82%," + (a * 0.4) + ")";
        ctx.fill();
      }

      ctx.globalCompositeOperation = "source-over";
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    init();
    animate();
  </script>
</body>
</html>
