<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Website</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  font-family: "Segoe UI", sans-serif;
  overflow: hidden;
}
h1 {
  font-size: 3rem;
  color: #fff;
  text-shadow: 0 0 20px #7b2ff7, 0 0 40px #7b2ff7;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
  from { text-shadow: 0 0 20px #7b2ff7, 0 0 40px #7b2ff7; }
  to { text-shadow: 0 0 30px #ff6fd8, 0 0 60px #ff6fd8; }
}
p {
  margin-top: 1rem;
  color: #aaa;
  font-size: 1.2rem;
}
.badge {
  margin-top: 2rem;
  padding: 0.8rem 1.5rem;
  background: linear-gradient(90deg, #7b2ff7, #ff6fd8);
  color: #fff;
  border-radius: 50px;
  font-weight: bold;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: -1;
}
.star {
  position: absolute;
  width: 3px; height: 3px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<h1>Hello, World!</h1>
<p>Built with GitHub Codespaces</p>
<div class="badge">My First Website</div>
<script>
const stars = document.getElementById("stars");
for (let i = 0; i < 80; i++) {
  const star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 3 + "s";
  stars.appendChild(star);
}
</script>
</body>
</html>
